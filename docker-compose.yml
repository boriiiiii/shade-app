# ============================================================================
# Shade — stack de développement (pensée pour OrbStack en local)
#
#   docker compose up --build
#
# Services :
#   - postgres : PostgreSQL 16 officiel, auto-hébergé, volume persistant + healthcheck
#   - api      : backend FastAPI (attend que postgres soit "healthy", applique les
#                migrations Alembic au démarrage puis lance uvicorn)
#
# Aucune dépendance à un service cloud managé.
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: shade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shade_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-shade}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shade} -d ${POSTGRES_DB:-shade}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: shade-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Force le host DB vers le service compose, quel que soit le .env local.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shade}:${POSTGRES_PASSWORD:-shade_dev_password}@postgres:5432/${POSTGRES_DB:-shade}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Bind-mount du code pour l'itération rapide en dev (hot-reload uvicorn).
    volumes:
      - ./services/api:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
    driver: local
